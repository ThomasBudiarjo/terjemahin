services:
  # takes jobs from the web app (apps/web, Cloudflare Worker or `pnpm dev`):
  #   API_URL and WORKER_TOKEN in .env, then  docker compose up --build worker
  worker:
    build: ./apps/worker
    image: terjemahin-worker:local
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway" # API_URL=http://host.docker.internal:5173 for `pnpm dev`

  # standalone web UI + JSON API of the worker (self-host, no app or queue needed):
  #   docker compose --profile web up web   ->  http://localhost:8000
  web:
    profiles: [web]
    build: ./apps/worker
    image: terjemahin-worker:local
    env_file:
      - path: .env
        required: false
    environment:
      STORAGE_DIR: /data
    command: ["terjemahin-worker", "web", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - web-data:/data

  # MongoDB for `pnpm dev` in apps/web (MONGODB_URI=mongodb://localhost:27017); production uses Atlas
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  web-data:
  mongo-data:
