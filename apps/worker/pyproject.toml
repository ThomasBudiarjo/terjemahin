[project]
name = "terjemahin-worker"
version = "0.1.0"
description = "Manga page translation worker: detect -> read+translate (LLM) -> clean -> typeset"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "onnxruntime>=1.17",
    "google-genai>=1.0",
    "pika>=1.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
]

[project.optional-dependencies]
train = [
    "ultralytics>=8.3",
    "huggingface_hub>=0.23",
    "onnx>=1.16",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
terjemahin-worker = "terjemahin_worker.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terjemahin_worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
